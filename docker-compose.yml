services:

  postgres:
    image: postgres:16-alpine
    container_name: logistics_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: logistics_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d logistics_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - logistics-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: logistics_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/logistics_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - logistics-network

  frontend:
    build:
      context: ./frontend/logistics-frontend
      dockerfile: Dockerfile
    container_name: logistics_frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - logistics-network

volumes:
  postgres_data:

networks:
  logistics-network:
    driver: bridge